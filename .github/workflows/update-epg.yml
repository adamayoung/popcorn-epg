name: Update EPG

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Overlapping runs would each rewrite the single-line tmdb-cache.json, and the
# second one's rebase in "Commit and push" would conflict. Queue them instead.
concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SWIFT_IMAGE: swift:6.2.0-jammy
      BINARY_DIR: /home/runner/.cache/popcorn-epg
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Only the built binary is cached. The key covers everything that affects
      # it (sources, package manifests and this workflow, which holds the image
      # and build flags), so it is rebuilt exactly when one of those changes.
      # There is deliberately no restore-keys fallback: a binary from different
      # sources must never be run.
      - name: Cache EPG fetcher binary
        id: binary-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.BINARY_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-popcorn-epg-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**/*.swift', '.github/workflows/update-epg.yml') }}

      # The Swift standard library and Foundation are linked statically so the
      # binary runs directly on the runner, which lets cache hits skip pulling
      # the Swift image altogether.
      - name: Build
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BINARY_DIR"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$BINARY_DIR":/out \
            -w /workspace \
            "$SWIFT_IMAGE" \
            bash -c 'swift build -c release -Xswiftc -warnings-as-errors --static-swift-stdlib --scratch-path /tmp/build && cp /tmp/build/release/PopcornEPG /out/PopcornEPG'

      - name: Run EPG fetcher
        run: |
          "$BINARY_DIR/PopcornEPG" --tmdb-api-key "$TMDB_API_KEY" --site-dir ./site
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Add Cloudflare Pages config to site
        run: cp cloudflare/_headers site/_headers

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 1

      - name: Get current date
        run: echo "RUN_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tmdb-cache.json
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Updated EPG listings on $RUN_DATE"
          # Rebase onto any commits that landed during the run, then push.
          # Retry in case main moves again between rebase and push.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Failed to push after 3 attempts." >&2
          exit 1

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        # No-op until CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are set.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=popcorn-epg
